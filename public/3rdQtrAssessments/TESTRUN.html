<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Princess Chronicles | Home</title>

    <!-- META -->
    <meta name="description" content="The Princess Chronicles — magical Disney princess experience">
    <meta name="author" content="Gabriel and Nidea">

    <!-- FAVICON -->
    <link rel="icon" href="assets/wdproj_logo-nobg.png">

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="public/3rdQtrAssessments/TESTRUN.css">
</head>

<body>

<header class="navigation">
    <div class="logo">
        <img src="assets/wdproj_logo-nobg.png" alt="Princess Chronicles logo">
    </div>
    <h1>The Princess Chronicles</h1>
</header>

<!-- HERO -->
<section class="hero">
    <h2>Enter the Magical World of Princesses ✨</h2>
</section>

<!-- LOGIN POPUP -->
<div class="overlay" id="overlay">

    <div class="login-popup">

        <span class="close-btn" id="closeBtn">&times;</span>

        <img src="assets/wdproj_logo-nobg.png" class="popup-logo">

        <h2>Welcome, Royal Guest 👑</h2>
        <p>Please log in to continue your adventure</p>

        <form id="loginForm">

            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">Enter the Kingdom ✨</button>

            <p id="message"></p>

        </form>

    </div>

</div>

<footer>
    <p>Sources (APA): Disney media resources; Google Fonts.</p>
</footer>

<script src="public/3rdQtrAssessments/TESTRUN.js"></script>

</body>
</html>
